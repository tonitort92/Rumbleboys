<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TROFEOS · previsualización</title>
<!-- ►TROFEOS · BANCO DE PRUEBA (no forma parte del juego)
     Sirve para ELEGIR la forma del trofeo sin tener que jugar una partida entera hasta un jefe.
     Se abre en http://localhost:8181/_trofeos_preview.html con el servidor de JUGAR.bat.
     Arriba: 4 formas candidatas. Abajo: la elegida en los 9 colores de mundo (los MISMOS de
     portalPalette() del juego). El botón GRIS/ENCENDIDO reproduce la transición real: el cubo
     nace apagado al salir del aro y se enciende al posarse sobre el ganador. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{ --ink:#e8ecf3; --dim:#8a93a3; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#11141a; color:var(--ink);
             font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  #wrap{ position:relative; height:100%; display:flex; flex-direction:column; }
  header{ padding:14px 18px 6px; }
  h1{ margin:0; font-size:16px; letter-spacing:.14em; font-weight:700; }
  header p{ margin:4px 0 0; color:var(--dim); font-size:12.5px; }
  #stage{ position:relative; flex:1; min-height:0; }
  canvas{ display:block; width:100%; height:100%; }
  .labels{ position:absolute; left:0; right:0; height:0; pointer-events:none; }
  .labels span{ position:absolute; transform:translateX(-50%); text-align:center;
                font-size:11px; letter-spacing:.08em; color:var(--dim); white-space:nowrap; }
  .labels span b{ display:block; color:var(--ink); font-size:12px; letter-spacing:.1em; }
  #bar{ padding:10px 18px 16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button{ background:#1d2230; color:var(--ink); border:1px solid #2e3546; border-radius:8px;
          padding:7px 13px; font:inherit; font-size:12.5px; cursor:pointer; letter-spacing:.04em; }
  button:hover{ background:#262d3e; }
  button[data-on="1"]{ background:#31405e; border-color:#4a5f8a; }
  #hint{ color:var(--dim); font-size:12px; margin-left:auto; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>TROFEOS · ¿QUÉ FORMA TIENE EL PREMIO?</h1>
    <p>Arriba las 4 candidatas. Abajo, la elegida en los 9 colores de mundo reales del juego.</p>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="labels" id="lblTop" style="top:0"></div>
    <div class="labels" id="lblBot" style="top:0"></div>
  </div>
  <div id="bar">
    <button id="bLit" data-on="1">ENCENDIDO / GRIS</button>
    <button id="bCrown" data-on="1">CORONA</button>
    <button id="bSpin" data-on="1">GIRO</button>
    <button id="bEdge" data-on="1">ARISTAS</button>
    <span id="hint">Pulsa 1-4 para elegir cuál se muestra abajo en los 9 colores</span>
  </div>
</div>
<script>
/* ---------- los 9 mundos, con los colores EXACTOS de portalPalette() del juego ---------- */
const WORLDS = [
  { s:1,  n:'PRADO',    c:[0x0d4a1e,0x35ff6a,0x1fd04a,0x8dffb0] },
  { s:2,  n:'JUNGLA',   c:[0x052008,0x0f6b22,0x0a5218,0x2a8a42] },
  { s:3,  n:'JAPÓN',    c:[0x3a0620,0xff2bd0,0xff1f9a,0xff8ad6] },
  { s:11, n:'WESTERN',  c:[0x5a1a08,0xff6a2a,0xe04a18,0xffb07a] },
  { s:4,  n:'DESIERTO', c:[0x5a3a12,0xffb040,0xe0982e,0xffd98a] },
  { s:5,  n:'PIRÁMIDE', c:[0x3e2708,0xc47a1e,0x9c6218,0xe0aa55] },
  { s:7,  n:'NEVADAS',  c:[0x123a5a,0x40b0ff,0x2b8ae0,0xa8e4ff] },
  { s:8,  n:'FÁBRICA',  c:[0x2a0a4e,0x9b3aff,0x7a1cff,0xc98aff] },
  { s:10, n:'ARCOÍRIS', c:[0x3a0a4e,0xff3ad0,0xff2bd0,0x2bffe0] },
];
const GREY = 0x9a9ea6;                     // el gris de El Gris: al que querían reducir el mundo

/* ---------- escena ---------- */
const cv = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(2, devicePixelRatio||1));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11141a);

const VIEW_W = 21;                          // ancho de mundo visible (fija la relación x → pantalla)
let camera = new THREE.OrthographicCamera(-VIEW_W/2, VIEW_W/2, 1, -1, .1, 100);
camera.position.set(0, 0, 20); camera.lookAt(0,0,0);

scene.add(new THREE.AmbientLight(0xffffff, .34));
const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x2a2118, .5); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff0d8, 1.15); key.position.set(4, 7, 8); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, .42); fill.position.set(-6, -2, 4); scene.add(fill);

/* ---------- geometrías ---------- */
/* cubo REDONDEADO/biselado: cuadrado con esquinas curvas extruido con bisel. Sin loaders extra. */
function roundedBoxGeo(size, radius, bevel){
  const s = size/2 - bevel, r = Math.min(radius, s*0.98);
  const sh = new THREE.Shape();
  sh.moveTo(-s+r, -s);
  sh.lineTo(s-r, -s);  sh.quadraticCurveTo(s, -s, s, -s+r);
  sh.lineTo(s, s-r);   sh.quadraticCurveTo(s, s, s-r, s);
  sh.lineTo(-s+r, s);  sh.quadraticCurveTo(-s, s, -s, s-r);
  sh.lineTo(-s, -s+r); sh.quadraticCurveTo(-s, -s, -s+r, -s);
  const g = new THREE.ExtrudeGeometry(sh, {
    depth: size - bevel*2, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel,
    bevelSegments:2, curveSegments:5, steps:1
  });
  g.center();
  return g;
}

function mkMat(flat){
  return new THREE.MeshStandardMaterial({ color:GREY, emissive:0x000000,
                                          roughness:.5, metalness:.2, flatShading:!!flat });
}
/* ►CORONA: puntas sobre la cara superior. Pirámides (cono de 4 lados) para que casen con el
   facetado del juego, no conos lisos. 4 altas en las esquinas + 4 bajas en los centros de lado →
   la silueta se lee como corona desde CUALQUIER ángulo, que importa porque el trofeo gira.
   Van en su propio grupo y con su propia lista de materiales: se tiñen con el tono CLARO de la
   paleta del mundo (c[3]) para que contrasten con el cuerpo (c[1]) y no se fundan en una mancha. */
function crownSpikes(top, mats, edges){
  const g = new THREE.Group();
  const TALL = .46, SHORT = .29, RT = .58, RM = .63;
  const pts = [
    [ RT, RT, TALL], [-RT, RT, TALL], [ RT,-RT, TALL], [-RT,-RT, TALL],   // esquinas: altas
    [ RM,  0, SHORT],[-RM,  0, SHORT],[  0, RM, SHORT],[  0,-RM, SHORT],  // centros de lado: bajas
  ];
  for(const p of pts){
    const h = p[2];
    const geo = new THREE.ConeGeometry(.17, h, 4);      // 4 radiales = pirámide
    const m = new THREE.Mesh(geo, mkMat(true));
    m.position.set(p[0], top + h/2, p[1]);
    m.rotation.y = Math.PI/4;                            // aristas de la pirámide hacia fuera
    g.add(m); mats.push(m.material);
    mkEdges(geo, m, edges);
  }
  return g;
}
function mkEdges(geo, parent, store){
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 28),
              new THREE.LineBasicMaterial({ color:0x000000, transparent:true, opacity:.55 }));
  parent.add(e); store.push(e); return e;
}

/* ---------- las 4 candidatas ----------
   Cada builder devuelve { g, mats[], edges[] }: mats = lo que se tiñe del color del mundo. */
const BUILDERS = [
{ name:'PELADO', desc:'lo que hay ahora',
  build(){
    const g = new THREE.Group(), mats=[], edges=[];
    const geo = new THREE.BoxGeometry(1.6,1.6,1.6);
    const m = new THREE.Mesh(geo, mkMat(true)); g.add(m); mats.push(m.material);
    mkEdges(geo, g, edges);
    return { g, mats, edges, top:.8 };            // cubo de 1.6 → su cara superior está algo más baja
  }},
{ name:'BISELADO', desc:'aristas matadas · pilla la luz',
  build(){
    const g = new THREE.Group(), mats=[], edges=[];
    const geo = roundedBoxGeo(1.7, .3, .08);
    const m = new THREE.Mesh(geo, mkMat(false)); g.add(m); mats.push(m.material);
    mkEdges(geo, g, edges);
    return { g, mats, edges };
  }},
{ name:'NÚCLEO', desc:'jaula oscura + corazón que brilla',
  build(){
    const g = new THREE.Group(), mats=[], edges=[];
    /* jaula: cubo exterior oscuro y translúcido */
    const outGeo = roundedBoxGeo(1.75, .26, .07);
    const outMat = new THREE.MeshStandardMaterial({ color:0x2b3040, roughness:.42, metalness:.55,
                                                    transparent:true, opacity:.34 });
    g.add(new THREE.Mesh(outGeo, outMat));
    mkEdges(outGeo, g, edges);
    /* núcleo: el que lleva el color del mundo */
    const inGeo = new THREE.BoxGeometry(1.0,1.0,1.0);
    const im = new THREE.Mesh(inGeo, mkMat(true)); g.add(im); mats.push(im.material);
    return { g, mats, edges, core:im };
  }},
{ name:'MEDALLA', desc:'marco + panel hundido (aquí iría la cara)',
  build(){
    const g = new THREE.Group(), mats=[], edges=[];
    const geo = roundedBoxGeo(1.7, .28, .08);
    const m = new THREE.Mesh(geo, mkMat(false)); g.add(m); mats.push(m.material);
    mkEdges(geo, g, edges);
    /* panel hundido en las 6 caras: es el hueco donde luego va la cara del jefe */
    const pGeo = new THREE.BoxGeometry(1.02, 1.02, .06);
    const pMat = new THREE.MeshStandardMaterial({ color:0x1a1e28, roughness:.85, metalness:.1 });
    const D = .855;
    const faces = [[0,0,D,0,0],[0,0,-D,0,Math.PI],[D,0,0,0,Math.PI/2],[-D,0,0,0,-Math.PI/2],
                   [0,D,0,-Math.PI/2,0],[0,-D,0,Math.PI/2,0]];
    for(const f of faces){
      const q = new THREE.Mesh(pGeo, pMat);
      q.position.set(f[0],f[1],f[2]); q.rotation.x=f[3]; q.rotation.y=f[4];
      g.add(q);
    }
    return { g, mats, edges };
  }},
];

/* ---------- montaje ---------- */
const TOP_Y = 2.35, BOT_Y = -2.6;
const tops = [], bots = [];
let pick = 1;                                  // candidata elegida para la fila de abajo (0..3)

/* la corona va SIEMPRE construida y se enseña/esconde con .visible → alternarla no reconstruye nada */
function attachCrown(o){
  o.spikeMats = [];
  o.crown = crownSpikes(o.top || .85, o.spikeMats, o.edges);
  o.g.add(o.crown);
}

BUILDERS.forEach((b, i)=>{
  const o = b.build();
  attachCrown(o);
  o.g.position.set((i - (BUILDERS.length-1)/2) * 4.4, TOP_Y, 0);
  o.g.scale.setScalar(1.15);
  scene.add(o.g);
  tops.push(Object.assign(o, { world:WORLDS[0], phase:i*0.7, baseY:TOP_Y }));
});

function buildBottom(){
  for(const o of bots) scene.remove(o.g);
  bots.length = 0;
  WORLDS.forEach((w, i)=>{
    const o = BUILDERS[pick].build();
    attachCrown(o);
    o.crown.visible = st.crown;
    for(const e of o.edges) e.visible = st.edge;
    o.g.position.set((i - (WORLDS.length-1)/2) * 2.15, BOT_Y, 0);
    o.g.scale.setScalar(.72);
    scene.add(o.g);
    bots.push(Object.assign(o, { world:w, phase:i*0.45, baseY:BOT_Y }));
  });
  refreshAll();
  drawLabels();
}

/* ---------- rótulos HTML alineados con las posiciones de mundo ---------- */
function xToPct(x){ return ((x + VIEW_W/2) / VIEW_W) * 100; }
function drawLabels(){
  const t = document.getElementById('lblTop'), b = document.getElementById('lblBot');
  t.innerHTML = BUILDERS.map((bd,i)=>{
    const x = (i - (BUILDERS.length-1)/2) * 4.4;
    return `<span style="left:${xToPct(x)}%"><b>${i+1} · ${bd.name}</b>${bd.desc}</span>`;
  }).join('');
  b.innerHTML = WORLDS.map((w,i)=>{
    const x = (i - (WORLDS.length-1)/2) * 2.15;
    return `<span style="left:${xToPct(x)}%">${w.n}</span>`;
  }).join('');
  positionLabels();
}
/* los rótulos van justo debajo de cada fila → hay que convertir Y de mundo a píxeles */
function positionLabels(){
  const h = cv.clientHeight, halfH = (camera.top - camera.bottom)/2;
  const yToPx = y => (1 - (y - camera.bottom)/(halfH*2)) * h;
  document.getElementById('lblTop').style.top = (yToPx(TOP_Y) + 62) + 'px';
  document.getElementById('lblBot').style.top = (yToPx(BOT_Y) + 40) + 'px';
}

/* ---------- estado de los botones ---------- */
const st = { lit:true, spin:true, edge:true, crown:true };
function wire(id, key, after){
  const el = document.getElementById(id);
  el.onclick = ()=>{ st[key] = !st[key]; el.dataset.on = st[key] ? '1' : '0'; if(after) after(); };
}
wire('bLit','lit'); wire('bSpin','spin');
wire('bEdge','edge',  ()=>{ for(const o of all) for(const e of o.edges) e.visible = st.edge; });
wire('bCrown','crown',()=>{ for(const o of all) o.crown.visible = st.crown; });
addEventListener('keydown', e=>{
  const n = parseInt(e.key,10);
  if(n>=1 && n<=BUILDERS.length){ pick = n-1; buildBottom(); for(const o of bots) for(const ed of o.edges) ed.visible = st.edge; }
});

/* ---------- bucle ---------- */
const cA = new THREE.Color(), cB = new THREE.Color(), cC = new THREE.Color();
const all = [];                                        // tops+bots sin reconstruir el array cada frame
function refreshAll(){ all.length = 0; for(const o of tops) all.push(o); for(const o of bots) all.push(o); }
let lit = 1, t0 = performance.now();
function tick(){
  const now = performance.now(), dt = Math.min(.05, (now - t0)/1000); t0 = now;
  const tt = now/1000;
  lit += ((st.lit?1:0) - lit) * Math.min(1, 3*dt);     // transición suave gris ↔ encendido

  for(const o of all){
    const w = o.world;
    cA.setHex(GREY); cB.setHex(w.c[1]);
    /* ARCOÍRIS: el stage 10 cicla el tono, igual que su portal en el juego */
    if(w.s === 10) cB.setHSL((tt*0.11)%1, .9, .58);
    for(const m of o.mats){
      m.color.copy(cA).lerp(cB, lit);
      m.emissive.copy(cB).multiplyScalar(lit*.5);
    }
    /* las puntas van con el tono CLARO de la paleta → contrastan con el cuerpo y no se funden */
    cC.setHex(w.c[3]);
    if(w.s === 10) cC.setHSL((tt*0.11 + .5)%1, .9, .72);   // arcoíris: tono opuesto al del cuerpo
    for(const m of o.spikeMats){
      m.color.copy(cA).lerp(cC, lit);
      m.emissive.copy(cC).multiplyScalar(lit*.42);
    }
    if(o.core) o.core.material.emissive.copy(cB).multiplyScalar(lit*.85);
    if(st.spin) o.g.rotation.y += (.55 + lit*.55) * dt;
    o.g.rotation.x = Math.sin(tt*1.2 + o.phase) * .13;
    o.g.position.y = o.baseY + Math.sin(tt*1.6 + o.phase)*.09;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

function resize(){
  const w = cv.clientWidth, h = cv.clientHeight;
  renderer.setSize(w, h, false);
  const aspect = w/h, halfH = (VIEW_W/aspect)/2;
  camera.left = -VIEW_W/2; camera.right = VIEW_W/2;
  camera.top = halfH; camera.bottom = -halfH;
  camera.updateProjectionMatrix();
  positionLabels();
}
addEventListener('resize', resize);
buildBottom(); resize(); tick();
</script>
</body>
</html>
